<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guess the Number Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="game-card">
            <h1>Guess the Number</h1>
            <p class="instructions">I'm thinking of a number between <span id="min-num">1</span> and <span id="max-num">100</span></p>
            
            <div class="game-area">
                <div class="input-group">
                    <input type="number" id="guess-input" placeholder="Enter your guess" min="1" max="100">
                    <button id="submit-btn" onclick="makeGuess()">Guess</button>
                </div>
                
                <div id="feedback" class="feedback"></div>
                
                <div class="stats">
                    <p>Tries: <span id="tries">0</span></p>
                </div>
            </div>
            
            <button id="restart-btn" onclick="restartGame()" style="display: none;">Play Again</button>
        </div>
    </div>
    
    <script src="game-ui.js"></script>
</body>
</html>
