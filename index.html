<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guess the Number Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="game-card">
            <h1 class="title">Guess the Number</h1>
            <p class="subtitle">I'm thinking of a number between <span id="min-range">1</span> and <span id="max-range">100</span></p>
            
            <div class="game-content">
                <div class="input-section">
                    <input type="number" id="guess-input" placeholder="Enter your guess" min="1" max="100" autofocus>
                    <button id="submit-btn" class="btn btn-primary">Submit Guess</button>
                </div>
                
                <div id="feedback" class="feedback"></div>
                
                <div class="stats">
                    <div class="stat-item">
                        <span class="stat-label">Attempts</span>
                        <span class="stat-value" id="attempts">0</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">Best Score</span>
                        <span class="stat-value" id="best-score">-</span>
                    </div>
                </div>
                
                <div id="guess-history" class="guess-history"></div>
            </div>
            
            <button id="reset-btn" class="btn btn-secondary">New Game</button>
            
            <div class="settings">
                <button id="settings-toggle" class="settings-toggle">⚙️</button>
                <div id="settings-panel" class="settings-panel hidden">
                    <h3>Game Settings</h3>
                    <div class="setting-item">
                        <label for="min-input">Min Number:</label>
                        <input type="number" id="min-input" value="1" min="1">
                    </div>
                    <div class="setting-item">
                        <label for="max-input">Max Number:</label>
                        <input type="number" id="max-input" value="100" min="2">
                    </div>
                    <button id="apply-settings" class="btn btn-small">Apply & Restart</button>
                </div>
            </div>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
