<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guess the Number Game</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <div class="game-card">
            <h1 class="game-title">🎯 Guess the Number</h1>
            <p class="game-description">I'm thinking of a number between <span class="highlight">1</span> and <span class="highlight">100</span></p>
            
            <div class="game-area">
                <div class="input-section">
                    <input type="number" id="guessInput" placeholder="Enter your guess..." min="1" max="100" class="guess-input">
                    <button id="submitGuess" class="submit-btn">Submit Guess</button>
                </div>
                
                <div class="feedback-section">
                    <div id="feedback" class="feedback"></div>
                    <div class="stats">
                        <div class="stat-item">
                            <span class="stat-label">Attempts:</span>
                            <span id="attempts" class="stat-value">0</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-label">Range:</span>
                            <span id="range" class="stat-value">1 - 100</span>
                        </div>
                    </div>
                </div>
                
                <div class="game-controls">
                    <button id="newGame" class="new-game-btn">New Game</button>
                    <button id="giveUp" class="give-up-btn">Give Up</button>
                </div>
            </div>
            
            <div class="game-history">
                <h3>Your Guesses:</h3>
                <div id="guessHistory" class="guess-list"></div>
            </div>
        </div>
    </div>
    
    <div id="winModal" class="modal">
        <div class="modal-content">
            <div class="celebration">🎉</div>
            <h2>Congratulations!</h2>
            <p id="winMessage"></p>
            <button id="playAgain" class="play-again-btn">Play Again</button>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
