<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guess the Number Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
        }

        .game-container {
            background: white;
            border-radius: 24px;
            padding: 48px 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 100%;
            text-align: center;
            animation: slideIn 0.5s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 {
            color: #2d3748;
            font-size: 2.5rem;
            margin-bottom: 12px;
            font-weight: 700;
        }

        .subtitle {
            color: #718096;
            font-size: 1.1rem;
            margin-bottom: 32px;
        }

        .game-info {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 16px;
            margin-bottom: 32px;
            font-size: 1.1rem;
            font-weight: 500;
        }

        .stats {
            display: flex;
            justify-content: space-around;
            margin-bottom: 32px;
            gap: 16px;
        }

        .stat-box {
            background: #f7fafc;
            padding: 16px 24px;
            border-radius: 12px;
            flex: 1;
        }

        .stat-label {
            color: #718096;
            font-size: 0.875rem;
            margin-bottom: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .stat-value {
            color: #2d3748;
            font-size: 2rem;
            font-weight: 700;
        }

        .input-group {
            margin-bottom: 24px;
        }

        input[type="number"] {
            width: 100%;
            padding: 16px 20px;
            font-size: 1.25rem;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            text-align: center;
            transition: all 0.3s ease;
            font-weight: 600;
        }

        input[type="number"]:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .button-group {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
        }

        button {
            flex: 1;
            padding: 16px 32px;
            font-size: 1.1rem;
            font-weight: 600;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .btn-secondary {
            background: #e2e8f0;
            color: #2d3748;
        }

        .btn-secondary:hover {
            background: #cbd5e0;
            transform: translateY(-2px);
        }

        .btn-secondary:active {
            transform: translateY(0);
        }

        .feedback {
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            padding: 16px;
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 16px;
            transition: all 0.3s ease;
        }

        .feedback.hidden {
            opacity: 0;
            visibility: hidden;
        }

        .feedback.success {
            background: #c6f6d5;
            color: #22543d;
            animation: bounce 0.5s ease;
        }

        .feedback.error {
            background: #fed7d7;
            color: #742a2a;
            animation: shake 0.5s ease;
        }

        .feedback.info {
            background: #bee3f8;
            color: #2c5282;
            animation: pulse 0.5s ease;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .history {
            margin-top: 24px;
            padding-top: 24px;
            border-top: 2px solid #e2e8f0;
        }

        .history-title {
            color: #4a5568;
            font-size: 0.875rem;
            font-weight: 600;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .history-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
        }

        .history-item {
            background: #edf2f7;
            color: #4a5568;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 0.875rem;
            font-weight: 600;
        }

        @media (max-width: 480px) {
            .game-container {
                padding: 32px 24px;
            }

            h1 {
                font-size: 2rem;
            }

            .stats {
                flex-direction: column;
            }

            .button-group {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>🎯 Guess the Number</h1>
        <p class="subtitle">I'm thinking of a number between <strong>1</strong> and <strong>100</strong></p>

        <div class="game-info" id="gameInfo">
            Make your first guess!
        </div>

        <div class="stats">
            <div class="stat-box">
                <div class="stat-label">Attempts</div>
                <div class="stat-value" id="attempts">0</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">Best Score</div>
                <div class="stat-value" id="bestScore">-</div>
            </div>
        </div>

        <div class="input-group">
            <input 
                type="number" 
                id="guessInput" 
                placeholder="Enter your guess" 
                min="1" 
                max="100"
                autofocus
            >
        </div>

        <div class="button-group">
            <button class="btn-primary" id="guessBtn">Submit Guess</button>
            <button class="btn-secondary" id="restartBtn">New Game</button>
        </div>

        <div class="feedback hidden" id="feedback"></div>

        <div class="history">
            <div class="history-title">Your Guesses</div>
            <div class="history-list" id="historyList">
                <span style="color: #a0aec0;">No guesses yet</span>
            </div>
        </div>
    </div>

    <script>
        class GuessTheNumberGame {
            constructor() {
                this.minNum = 1;
                this.maxNum = 100;
                this.numberToGuess = this.generateRandomNumber();
                this.attempts = 0;
                this.guessHistory = [];
                this.bestScore = localStorage.getItem('bestScore') || null;
                this.gameActive = true;

                this.initElements();
                this.attachEventListeners();
                this.updateBestScore();
            }

            initElements() {
                this.guessInput = document.getElementById('guessInput');
                this.guessBtn = document.getElementById('guessBtn');
                this.restartBtn = document.getElementById('restartBtn');
                this.feedback = document.getElementById('feedback');
                this.gameInfo = document.getElementById('gameInfo');
                this.attemptsDisplay = document.getElementById('attempts');
                this.bestScoreDisplay = document.getElementById('bestScore');
                this.historyList = document.getElementById('historyList');
            }

            attachEventListeners() {
                this.guessBtn.addEventListener('click', () => this.handleGuess());
                this.restartBtn.addEventListener('click', () => this.restartGame());
                this.guessInput.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') this.handleGuess();
                });
            }

            generateRandomNumber() {
                return Math.floor(Math.random() * (this.maxNum - this.minNum + 1)) + this.minNum;
            }

            handleGuess() {
                if (!this.gameActive) return;

                const guess = parseInt(this.guessInput.value);

                if (!guess || guess < this.minNum || guess > this.maxNum) {
                    this.showFeedback(`Please enter a number between ${this.minNum} and ${this.maxNum}`, 'error');
                    return;
                }

                if (this.guessHistory.includes(guess)) {
                    this.showFeedback('You already guessed that number!', 'error');
                    return;
                }

                this.attempts++;
                this.guessHistory.push(guess);
                this.updateAttempts();
                this.updateHistory();

                if (guess === this.numberToGuess) {
                    this.handleWin();
                } else if (guess < this.numberToGuess) {
                    this.showFeedback('📈 Too low! Try a higher number', 'info');
                    this.gameInfo.textContent = `${guess} is too low! Go higher!`;
                } else {
                    this.showFeedback('📉 Too high! Try a lower number', 'info');
                    this.gameInfo.textContent = `${guess} is too high! Go lower!`;
                }

                this.guessInput.value = '';
                this.guessInput.focus();
            }

            handleWin() {
                this.gameActive = false;
                this.showFeedback(`🎉 Congratulations! You found ${this.numberToGuess} in ${this.attempts} ${this.attempts === 1 ? 'try' : 'tries'}!`, 'success');
                this.gameInfo.textContent = `🏆 You won in ${this.attempts} ${this.attempts === 1 ? 'attempt' : 'attempts'}!`;
                this.guessInput.disabled = true;
                this.guessBtn.disabled = true;

                if (!this.bestScore || this.attempts < this.bestScore) {
                    this.bestScore = this.attempts;
                    localStorage.setItem('bestScore', this.bestScore);
                    this.updateBestScore();
                }
            }

            showFeedback(message, type) {
                this.feedback.textContent = message;
                this.feedback.className = `feedback ${type}`;
            }

            updateAttempts() {
                this.attemptsDisplay.textContent = this.attempts;
            }

            updateBestScore() {
                this.bestScoreDisplay.textContent = this.bestScore || '-';
            }

            updateHistory() {
                if (this.guessHistory.length === 0) {
                    this.historyList.innerHTML = '<span style="color: #a0aec0;">No guesses yet</span>';
                } else {
                    this.historyList.innerHTML = this.guessHistory
                        .map(guess => `<span class="history-item">${guess}</span>`)
                        .join('');
                }
            }

            restartGame() {
                this.numberToGuess = this.generateRandomNumber();
                this.attempts = 0;
                this.guessHistory = [];
                this.gameActive = true;

                this.guessInput.disabled = false;
                this.guessInput.value = '';
                this.guessBtn.disabled = false;
                
                this.updateAttempts();
                this.updateHistory();
                
                this.feedback.className = 'feedback hidden';
                this.gameInfo.textContent = 'Make your first guess!';
                
                this.guessInput.focus();
            }
        }

        const game = new GuessTheNumberGame();
    </script>
</body>
</html>
