<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guess the Number Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="game-card">
            <h1>🎯 Guess the Number</h1>
            <p class="subtitle">I'm thinking of a number between <span id="min-range">1</span> and <span id="max-range">100</span></p>
            
            <div class="game-area">
                <div class="input-group">
                    <input type="number" id="guess-input" placeholder="Enter your guess" min="1" max="100">
                    <button id="submit-btn" class="btn btn-primary">Guess</button>
                </div>
                
                <div id="message" class="message"></div>
                
                <div class="stats">
                    <div class="stat-item">
                        <span class="stat-label">Tries:</span>
                        <span id="tries-count" class="stat-value">0</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">Best Score:</span>
                        <span id="best-score" class="stat-value">-</span>
                    </div>
                </div>
            </div>
            
            <button id="reset-btn" class="btn btn-secondary">New Game</button>
            
            <div class="settings">
                <h3>Settings</h3>
                <div class="range-inputs">
                    <div class="range-input">
                        <label for="min-input">Min:</label>
                        <input type="number" id="min-input" value="1" min="1">
                    </div>
                    <div class="range-input">
                        <label for="max-input">Max:</label>
                        <input type="number" id="max-input" value="100" min="2">
                    </div>
                    <button id="apply-range-btn" class="btn btn-small">Apply</button>
                </div>
            </div>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
