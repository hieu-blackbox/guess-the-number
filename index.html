<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guess the Number Game</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <div class="game-card">
            <h1 class="title">Guess the Number</h1>
            <p class="subtitle">I'm thinking of a number between <span id="minNum">1</span> and <span id="maxNum">100</span></p>
            
            <div class="game-content">
                <div class="input-group">
                    <input 
                        type="number" 
                        id="guessInput" 
                        placeholder="Enter your guess"
                        min="1"
                        max="100"
                        autocomplete="off"
                    >
                    <button id="submitBtn" class="btn btn-primary">Submit Guess</button>
                </div>
                
                <div id="feedback" class="feedback"></div>
                
                <div class="stats">
                    <div class="stat-item">
                        <span class="stat-label">Attempts</span>
                        <span id="tries" class="stat-value">0</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">Range</span>
                        <span id="range" class="stat-value">1-100</span>
                    </div>
                </div>
                
                <div class="history-container">
                    <h3 class="history-title">Your Guesses</h3>
                    <div id="guessHistory" class="guess-history"></div>
                </div>
                
                <button id="resetBtn" class="btn btn-secondary">New Game</button>
            </div>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
