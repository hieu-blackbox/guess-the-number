<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guess the Number Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .game-container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 100%;
            text-align: center;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 2rem;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 1rem;
        }

        .game-info {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 30px;
        }

        .range {
            font-size: 1.2rem;
            color: #667eea;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .tries {
            font-size: 1rem;
            color: #666;
        }

        .input-group {
            margin-bottom: 20px;
        }

        input[type="number"] {
            width: 100%;
            padding: 15px;
            font-size: 1.2rem;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            text-align: center;
            transition: border-color 0.3s;
        }

        input[type="number"]:focus {
            outline: none;
            border-color: #667eea;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        button {
            flex: 1;
            padding: 15px;
            font-size: 1rem;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        button:active {
            transform: translateY(0);
        }

        .guess-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .reset-btn {
            background: #6c757d;
            color: white;
        }

        .message {
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 1.1rem;
            font-weight: 500;
            min-height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }

        .message.hidden {
            opacity: 0;
            visibility: hidden;
        }

        .message.low {
            background: #fff3cd;
            color: #856404;
            border: 2px solid #ffc107;
        }

        .message.high {
            background: #f8d7da;
            color: #721c24;
            border: 2px solid #dc3545;
        }

        .message.success {
            background: #d4edda;
            color: #155724;
            border: 2px solid #28a745;
        }

        .history {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 2px solid #e0e0e0;
        }

        .history h3 {
            color: #333;
            margin-bottom: 10px;
            font-size: 1rem;
        }

        .guess-history {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
        }

        .guess-item {
            background: #e9ecef;
            padding: 8px 12px;
            border-radius: 5px;
            font-size: 0.9rem;
            color: #495057;
        }

        @media (max-width: 480px) {
            .game-container {
                padding: 30px 20px;
            }

            h1 {
                font-size: 1.5rem;
            }

            .button-group {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>🎯 Guess the Number</h1>
        <p class="subtitle">Can you guess the secret number?</p>

        <div class="game-info">
            <div class="range">Range: <span id="min">1</span> - <span id="max">100</span></div>
            <div class="tries">Attempts: <span id="tries">0</span></div>
        </div>

        <div class="message hidden" id="message"></div>

        <div class="input-group">
            <input type="number" id="guessInput" placeholder="Enter your guess" min="1" max="100">
        </div>

        <div class="button-group">
            <button class="guess-btn" id="guessBtn">Make Guess</button>
            <button class="reset-btn" id="resetBtn">New Game</button>
        </div>

        <div class="history">
            <h3>Previous Guesses</h3>
            <div class="guess-history" id="guessHistory"></div>
        </div>
    </div>

    <script>
        class GuessTheNumberGame {
            constructor(min, max) {
                this.min = min;
                this.max = max;
                this.numberToGuess = this.generateRandomNumber();
                this.tries = 0;
                this.guessHistory = [];
                this.gameOver = false;
            }

            generateRandomNumber() {
                return Math.floor(Math.random() * (this.max - this.min + 1)) + this.min;
            }

            makeGuess(guess) {
                if (this.gameOver) {
                    return { type: 'info', message: 'Game is over! Start a new game.' };
                }

                if (guess < this.min || guess > this.max) {
                    return { type: 'error', message: `Please enter a number between ${this.min} and ${this.max}` };
                }

                this.tries++;
                this.guessHistory.push(guess);

                if (guess < this.numberToGuess) {
                    return { type: 'low', message: '📉 Too low! Try a higher number.' };
                } else if (guess > this.numberToGuess) {
                    return { type: 'high', message: '📈 Too high! Try a lower number.' };
                } else {
                    this.gameOver = true;
                    return { 
                        type: 'success', 
                        message: `🎉 Congratulations! You guessed ${this.numberToGuess} in ${this.tries} ${this.tries === 1 ? 'try' : 'tries'}!` 
                    };
                }
            }

            reset() {
                this.numberToGuess = this.generateRandomNumber();
                this.tries = 0;
                this.guessHistory = [];
                this.gameOver = false;
            }
        }

        const game = new GuessTheNumberGame(1, 100);
        const guessInput = document.getElementById('guessInput');
        const guessBtn = document.getElementById('guessBtn');
        const resetBtn = document.getElementById('resetBtn');
        const messageDiv = document.getElementById('message');
        const triesSpan = document.getElementById('tries');
        const guessHistoryDiv = document.getElementById('guessHistory');

        function updateUI() {
            triesSpan.textContent = game.tries;
            
            guessHistoryDiv.innerHTML = '';
            game.guessHistory.forEach(guess => {
                const guessItem = document.createElement('div');
                guessItem.className = 'guess-item';
                guessItem.textContent = guess;
                guessHistoryDiv.appendChild(guessItem);
            });
        }

        function showMessage(type, text) {
            messageDiv.className = `message ${type}`;
            messageDiv.textContent = text;
        }

        function hideMessage() {
            messageDiv.className = 'message hidden';
        }

        function handleGuess() {
            const guess = parseInt(guessInput.value);

            if (isNaN(guess)) {
                showMessage('error', 'Please enter a valid number!');
                return;
            }

            const result = game.makeGuess(guess);
            showMessage(result.type, result.message);
            updateUI();

            if (result.type === 'success') {
                guessInput.disabled = true;
                guessBtn.disabled = true;
            }

            guessInput.value = '';
            guessInput.focus();
        }

        function handleReset() {
            game.reset();
            updateUI();
            hideMessage();
            guessInput.disabled = false;
            guessBtn.disabled = false;
            guessInput.value = '';
            guessInput.focus();
        }

        guessBtn.addEventListener('click', handleGuess);
        resetBtn.addEventListener('click', handleReset);

        guessInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                handleGuess();
            }
        });

        guessInput.focus();
    </script>
</body>
</html>
