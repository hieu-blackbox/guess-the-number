<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guess the Number Game</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 50%, #d946ef 100%);
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%);
            border-radius: 50%;
            top: -250px;
            right: -250px;
            animation: float 20s infinite ease-in-out;
        }

        body::after {
            content: '';
            position: absolute;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(255,255,255,0.08) 0%, transparent 70%);
            border-radius: 50%;
            bottom: -200px;
            left: -200px;
            animation: float 15s infinite ease-in-out reverse;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(50px, 50px) scale(1.1); }
        }

        .game-container {
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(20px);
            border-radius: 32px;
            padding: 48px 40px;
            box-shadow: 0 25px 80px rgba(0, 0, 0, 0.25), 0 0 0 1px rgba(255, 255, 255, 0.3);
            max-width: 520px;
            width: 100%;
            text-align: center;
            animation: slideIn 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            z-index: 1;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-40px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        h1 {
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 50%, #d946ef 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-size: 3rem;
            margin-bottom: 8px;
            font-weight: 800;
            letter-spacing: -1px;
            line-height: 1.2;
        }

        .subtitle {
            color: #64748b;
            font-size: 1rem;
            margin-bottom: 32px;
            font-weight: 500;
        }

        .subtitle strong {
            color: #8b5cf6;
            font-weight: 700;
        }

        .game-info {
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 50%, #d946ef 100%);
            color: white;
            padding: 24px;
            border-radius: 20px;
            margin-bottom: 32px;
            font-size: 1.15rem;
            font-weight: 600;
            box-shadow: 0 10px 30px rgba(139, 92, 246, 0.3);
            position: relative;
            overflow: hidden;
        }

        .game-info::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.15) 0%, transparent 70%);
            animation: shimmer 3s infinite;
        }

        @keyframes shimmer {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(-30px, -30px); }
        }

        .stats {
            display: flex;
            justify-content: space-around;
            margin-bottom: 32px;
            gap: 16px;
        }

        .stat-box {
            background: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%);
            padding: 20px 24px;
            border-radius: 16px;
            flex: 1;
            border: 2px solid #e2e8f0;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            overflow: hidden;
        }

        .stat-box::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(139, 92, 246, 0.05) 0%, rgba(217, 70, 239, 0.05) 100%);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .stat-box:hover::before {
            opacity: 1;
        }

        .stat-box:hover {
            transform: translateY(-4px);
            border-color: #c4b5fd;
            box-shadow: 0 8px 24px rgba(139, 92, 246, 0.15);
        }

        .stat-label {
            color: #64748b;
            font-size: 0.8rem;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
        }

        .stat-value {
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-size: 2.25rem;
            font-weight: 800;
            line-height: 1;
        }

        .input-group {
            margin-bottom: 24px;
            position: relative;
        }

        input[type="number"] {
            width: 100%;
            padding: 20px 24px;
            font-size: 1.5rem;
            border: 3px solid #e2e8f0;
            border-radius: 16px;
            text-align: center;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            font-weight: 700;
            font-family: 'Poppins', sans-serif;
            background: #ffffff;
            color: #1e293b;
        }

        input[type="number"]:focus {
            outline: none;
            border-color: #8b5cf6;
            box-shadow: 0 0 0 4px rgba(139, 92, 246, 0.15), 0 8px 24px rgba(139, 92, 246, 0.2);
            transform: translateY(-2px);
        }

        input[type="number"]::placeholder {
            color: #cbd5e1;
            font-weight: 500;
        }

        .button-group {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
        }

        button {
            flex: 1;
            padding: 18px 32px;
            font-size: 1rem;
            font-weight: 700;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-family: 'Poppins', sans-serif;
            position: relative;
            overflow: hidden;
        }

        button::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        button:active::before {
            width: 300px;
            height: 300px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 50%, #d946ef 100%);
            color: white;
            box-shadow: 0 4px 16px rgba(139, 92, 246, 0.4);
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 32px rgba(139, 92, 246, 0.5);
        }

        .btn-primary:active {
            transform: translateY(-1px);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .btn-secondary {
            background: linear-gradient(135deg, #f1f5f9 0%, #e2e8f0 100%);
            color: #475569;
            border: 2px solid #cbd5e1;
        }

        .btn-secondary:hover {
            background: linear-gradient(135deg, #e2e8f0 0%, #cbd5e1 100%);
            transform: translateY(-3px);
            box-shadow: 0 8px 24px rgba(100, 116, 139, 0.15);
        }

        .btn-secondary:active {
            transform: translateY(-1px);
        }

        .feedback {
            min-height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 16px;
            padding: 20px 24px;
            font-size: 1.05rem;
            font-weight: 600;
            margin-bottom: 16px;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            border: 2px solid transparent;
        }

        .feedback.hidden {
            opacity: 0;
            visibility: hidden;
            transform: scale(0.9);
        }

        .feedback.success {
            background: linear-gradient(135deg, #d1fae5 0%, #a7f3d0 100%);
            color: #065f46;
            border-color: #6ee7b7;
            animation: bounce 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 8px 24px rgba(16, 185, 129, 0.25);
        }

        .feedback.error {
            background: linear-gradient(135deg, #fee2e2 0%, #fecaca 100%);
            color: #991b1b;
            border-color: #fca5a5;
            animation: shake 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 8px 24px rgba(239, 68, 68, 0.25);
        }

        .feedback.info {
            background: linear-gradient(135deg, #ddd6fe 0%, #c4b5fd 100%);
            color: #5b21b6;
            border-color: #a78bfa;
            animation: pulse 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 8px 24px rgba(139, 92, 246, 0.25);
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0) scale(1); }
            25% { transform: translateY(-12px) scale(1.02); }
            50% { transform: translateY(0) scale(1); }
            75% { transform: translateY(-6px) scale(1.01); }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0) rotate(0deg); }
            20% { transform: translateX(-12px) rotate(-2deg); }
            40% { transform: translateX(12px) rotate(2deg); }
            60% { transform: translateX(-8px) rotate(-1deg); }
            80% { transform: translateX(8px) rotate(1deg); }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.06); }
        }

        .history {
            margin-top: 28px;
            padding-top: 28px;
            border-top: 2px solid #e2e8f0;
        }

        .history-title {
            color: #64748b;
            font-size: 0.8rem;
            font-weight: 700;
            margin-bottom: 16px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        .history-list {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }

        .history-item {
            background: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%);
            color: #475569;
            padding: 10px 16px;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 700;
            border: 2px solid #e2e8f0;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            animation: popIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .history-item:hover {
            transform: translateY(-2px) scale(1.05);
            border-color: #c4b5fd;
            box-shadow: 0 4px 12px rgba(139, 92, 246, 0.2);
        }

        @keyframes popIn {
            0% {
                opacity: 0;
                transform: scale(0.5);
            }
            100% {
                opacity: 1;
                transform: scale(1);
            }
        }

        @media (max-width: 480px) {
            .game-container {
                padding: 32px 24px;
                border-radius: 24px;
            }

            h1 {
                font-size: 2.25rem;
            }

            .subtitle {
                font-size: 0.95rem;
            }

            .stats {
                flex-direction: column;
            }

            .button-group {
                flex-direction: column;
            }

            input[type="number"] {
                font-size: 1.25rem;
                padding: 18px 20px;
            }

            button {
                padding: 16px 24px;
            }
        }

        /* Confetti animation for win */
        @keyframes confetti-fall {
            0% {
                transform: translateY(-100vh) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(100vh) rotate(720deg);
                opacity: 0;
            }
        }

        .confetti {
            position: fixed;
            width: 10px;
            height: 10px;
            background: #f59e0b;
            position: absolute;
            animation: confetti-fall 3s linear;
            z-index: 1000;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>🎯 Guess the Number</h1>
        <p class="subtitle">I'm thinking of a number between <strong>1</strong> and <strong>100</strong></p>

        <div class="game-info" id="gameInfo">
            Make your first guess!
        </div>

        <div class="stats">
            <div class="stat-box">
                <div class="stat-label">Attempts</div>
                <div class="stat-value" id="attempts">0</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">Best Score</div>
                <div class="stat-value" id="bestScore">-</div>
            </div>
        </div>

        <div class="input-group">
            <input 
                type="number" 
                id="guessInput" 
                placeholder="Enter your guess" 
                min="1" 
                max="100"
                autofocus
            >
        </div>

        <div class="button-group">
            <button class="btn-primary" id="guessBtn">Submit Guess</button>
            <button class="btn-secondary" id="restartBtn">New Game</button>
        </div>

        <div class="feedback hidden" id="feedback"></div>

        <div class="history">
            <div class="history-title">Your Guesses</div>
            <div class="history-list" id="historyList">
                <span style="color: #a0aec0;">No guesses yet</span>
            </div>
        </div>
    </div>

    <script>
        class GuessTheNumberGame {
            constructor() {
                this.minNum = 1;
                this.maxNum = 100;
                this.numberToGuess = this.generateRandomNumber();
                this.attempts = 0;
                this.guessHistory = [];
                this.bestScore = localStorage.getItem('bestScore') || null;
                this.gameActive = true;

                this.initElements();
                this.attachEventListeners();
                this.updateBestScore();
            }

            initElements() {
                this.guessInput = document.getElementById('guessInput');
                this.guessBtn = document.getElementById('guessBtn');
                this.restartBtn = document.getElementById('restartBtn');
                this.feedback = document.getElementById('feedback');
                this.gameInfo = document.getElementById('gameInfo');
                this.attemptsDisplay = document.getElementById('attempts');
                this.bestScoreDisplay = document.getElementById('bestScore');
                this.historyList = document.getElementById('historyList');
            }

            attachEventListeners() {
                this.guessBtn.addEventListener('click', () => this.handleGuess());
                this.restartBtn.addEventListener('click', () => this.restartGame());
                this.guessInput.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') this.handleGuess();
                });
            }

            generateRandomNumber() {
                return Math.floor(Math.random() * (this.maxNum - this.minNum + 1)) + this.minNum;
            }

            handleGuess() {
                if (!this.gameActive) return;

                const guess = parseInt(this.guessInput.value);

                if (!guess || guess < this.minNum || guess > this.maxNum) {
                    this.showFeedback(`Please enter a number between ${this.minNum} and ${this.maxNum}`, 'error');
                    return;
                }

                if (this.guessHistory.includes(guess)) {
                    this.showFeedback('You already guessed that number!', 'error');
                    return;
                }

                this.attempts++;
                this.guessHistory.push(guess);
                this.updateAttempts();
                this.updateHistory();

                if (guess === this.numberToGuess) {
                    this.handleWin();
                } else if (guess < this.numberToGuess) {
                    this.showFeedback('📈 Too low! Try a higher number', 'info');
                    this.gameInfo.textContent = `${guess} is too low! Go higher!`;
                } else {
                    this.showFeedback('📉 Too high! Try a lower number', 'info');
                    this.gameInfo.textContent = `${guess} is too high! Go lower!`;
                }

                this.guessInput.value = '';
                this.guessInput.focus();
            }

            handleWin() {
                this.gameActive = false;
                this.showFeedback(`🎉 Congratulations! You found ${this.numberToGuess} in ${this.attempts} ${this.attempts === 1 ? 'try' : 'tries'}!`, 'success');
                this.gameInfo.textContent = `🏆 You won in ${this.attempts} ${this.attempts === 1 ? 'attempt' : 'attempts'}!`;
                this.guessInput.disabled = true;
                this.guessBtn.disabled = true;

                // Create confetti effect
                this.createConfetti();

                if (!this.bestScore || this.attempts < this.bestScore) {
                    this.bestScore = this.attempts;
                    localStorage.setItem('bestScore', this.bestScore);
                    this.updateBestScore();
                    
                    // Show new record message
                    setTimeout(() => {
                        this.gameInfo.textContent = `🎊 NEW RECORD! ${this.attempts} ${this.attempts === 1 ? 'attempt' : 'attempts'}!`;
                    }, 2000);
                }
            }

            createConfetti() {
                const colors = ['#6366f1', '#8b5cf6', '#d946ef', '#f59e0b', '#10b981', '#ef4444', '#3b82f6'];
                const confettiCount = 50;

                for (let i = 0; i < confettiCount; i++) {
                    setTimeout(() => {
                        const confetti = document.createElement('div');
                        confetti.className = 'confetti';
                        confetti.style.left = Math.random() * 100 + '%';
                        confetti.style.background = colors[Math.floor(Math.random() * colors.length)];
                        confetti.style.width = (Math.random() * 10 + 5) + 'px';
                        confetti.style.height = (Math.random() * 10 + 5) + 'px';
                        confetti.style.borderRadius = Math.random() > 0.5 ? '50%' : '0';
                        confetti.style.animationDuration = (Math.random() * 2 + 2) + 's';
                        confetti.style.animationDelay = (Math.random() * 0.5) + 's';
                        
                        document.body.appendChild(confetti);
                        
                        setTimeout(() => confetti.remove(), 4000);
                    }, i * 30);
                }
            }

            showFeedback(message, type) {
                this.feedback.textContent = message;
                this.feedback.className = `feedback ${type}`;
            }

            updateAttempts() {
                this.attemptsDisplay.textContent = this.attempts;
            }

            updateBestScore() {
                this.bestScoreDisplay.textContent = this.bestScore || '-';
            }

            updateHistory() {
                if (this.guessHistory.length === 0) {
                    this.historyList.innerHTML = '<span style="color: #a0aec0;">No guesses yet</span>';
                } else {
                    this.historyList.innerHTML = this.guessHistory
                        .map(guess => `<span class="history-item">${guess}</span>`)
                        .join('');
                }
            }

            restartGame() {
                this.numberToGuess = this.generateRandomNumber();
                this.attempts = 0;
                this.guessHistory = [];
                this.gameActive = true;

                this.guessInput.disabled = false;
                this.guessInput.value = '';
                this.guessBtn.disabled = false;
                
                this.updateAttempts();
                this.updateHistory();
                
                this.feedback.className = 'feedback hidden';
                this.gameInfo.textContent = 'Make your first guess!';
                
                this.guessInput.focus();
            }
        }

        const game = new GuessTheNumberGame();
    </script>
</body>
</html>
