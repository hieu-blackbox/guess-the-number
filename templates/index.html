<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guess the Number Game</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <div class="game-card">
            <h1>🎯 Guess the Number</h1>
            <p class="subtitle">Can you guess the secret number?</p>
            
            <div id="game-setup" class="section">
                <div class="range-inputs">
                    <div class="input-group">
                        <label for="min-num">Min:</label>
                        <input type="number" id="min-num" value="1" min="1">
                    </div>
                    <div class="input-group">
                        <label for="max-num">Max:</label>
                        <input type="number" id="max-num" value="100" min="2">
                    </div>
                </div>
                <button id="start-btn" class="btn btn-primary">Start New Game</button>
            </div>
            
            <div id="game-play" class="section hidden">
                <div class="game-info">
                    <div class="info-box">
                        <span class="label">Range:</span>
                        <span id="range-display" class="value">1 - 100</span>
                    </div>
                    <div class="info-box">
                        <span class="label">Attempts:</span>
                        <span id="tries-display" class="value">0</span>
                    </div>
                </div>
                
                <div id="feedback" class="feedback"></div>
                
                <div class="guess-input">
                    <input type="number" id="guess-input" placeholder="Enter your guess" min="1">
                    <button id="guess-btn" class="btn btn-primary">Guess</button>
                </div>
                
                <button id="reset-btn" class="btn btn-secondary">New Game</button>
            </div>
        </div>
    </div>
    
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
